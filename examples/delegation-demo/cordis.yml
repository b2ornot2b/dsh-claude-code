# The acceptance composition (spec §12 / api-contract §7): the real thing, a
# plain cordis.yml booted through the cordis Loader, mounting all three
# packages of this integration plus the dsh seams they lean on — jobs
# (background delegation), approval and clarifying questions (the ask
# channel). Every `name` is a bare package specifier, so the Loader `import()`s
# the packages' BUILT entry points (`lib/index.js`) — `pnpm run build` must
# have run first (see `run.mjs`).
#
# This is the same shape as `tests/composition/cordis.yml`, extended with the
# `questions`/`approval` rows a human-shaped answerer needs to attach to.

# --- published dsh services this integration depends on ----------------------
- id: sessions
  name: '@deepseek-ai/dsh-session'

- id: agents
  name: '@deepseek-ai/dsh-agent'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: questions
  name: '@deepseek-ai/dsh-user-questions'

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask

# --- the jobs runtime `claude_code_open({ background: true })` requires ------
- id: jobs
  name: '@deepseek-ai/dsh-jobs-local'

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# --- this integration ---------------------------------------------------------
- id: claude-code
  name: '@deepseek-ai/dsh-claude-code'
  config:
    prewarm: false
    defaults:
      model: claude-haiku-4-5-20251001
      settingSources: []

- id: tool-claude-code
  name: '@deepseek-ai/dsh-tool-claude-code'

- id: claude-code-agent
  name: '@deepseek-ai/dsh-claude-code-agent'
